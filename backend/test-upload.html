<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload Image Thème</title>
</head>
<body>
    <h1>Test Upload Image Thème</h1>
    
    <form id="uploadForm" enctype="multipart/form-data">
        <div>
            <label for="name">Nom:</label>
            <input type="text" id="name" name="name" value="Test Theme" required>
        </div>
        
        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description" required>Description de test</textarea>
        </div>
        
        <div>
            <label for="image">Image:</label>
            <input type="file" id="image" name="image" accept="image/*" required>
        </div>
        
        <button type="submit">Tester Upload</button>
    </form>

    <div id="result"></div>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('image', document.getElementById('image').files[0]);
            
            console.log('FormData contents:');
            for (let [key, value] of formData.entries()) {
                console.log(key, value);
            }
            
            try {
                // Test d'abord la route de test
                const testResponse = await fetch('/api/themes/test-upload', {
                    method: 'POST',
                    // Pas d'Authorization pour le test
                    body: formData
                });
                
                const testResult = await testResponse.json();
                document.getElementById('result').innerHTML = `
                    <h3>Résultat Test Upload:</h3>
                    <pre>${JSON.stringify(testResult, null, 2)}</pre>
                `;
                
                console.log('Test upload result:', testResult);
                
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('result').innerHTML = `
                    <h3>Erreur:</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
